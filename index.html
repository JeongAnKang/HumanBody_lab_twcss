<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인체 에너지 추적단</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Tailwind CSS 라이브러리 추가 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <header class="top-bar">
        <div class="logo">🧬 인체 에너지 추적단</div>
        <button id="btn-reset" class="btn-ghost">기록 초기화 ↺</button>
    </header>

    <!-- Tailwind Grid 적용: 스마트폰 1열, 태블릿 2열, 데스크톱 3열 / 태블릿 이상부터는 화면 높이 고정 -->
    <main class="dashboard grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:max-h-[calc(100dvh-75px)]">
        
        <!-- 지도 영역: 태블릿에서 1칸(반반), 데스크톱에서 2칸 차지 / min-h-0으로 내부 넘침 방지 -->
        <section class="card map-card md:col-span-1 lg:col-span-2 min-h-0">
            <div class="card-header-text">
                <h2 class="card-title">인체 탐험 지도</h2>
                <p class="card-subtitle">안내도를 중심으로 둥글게 모인 퀘스트를 시작하세요.</p>
            </div>
            
            <div class="map-area">
            <div class="quest-circle-container">
                <div class="center-illustration">
                    <!-- 👤 이모지 대신 이미지 삽입 및 크기/애니메이션 맞춤 설정 -->
                    <img src="images/HB_main_02.png" alt="인체 탐험 코어" style="width: 75%; height: 75%; object-fit: contain; animation: energy-pulse 3s infinite ease-in-out; filter: drop-shadow(0 0 15px rgba(255, 143, 171, 0.6));">
                </div>
                <a href="quest1.html" class="quest-bubble q1">1. 영양소</a>
                <a href="quest2.html" class="quest-bubble q2">2. 소화</a>
                <a href="quest3.html" class="quest-bubble q3">3. 순환</a>
                <a href="quest4.html" class="quest-bubble q4">4. 호흡</a>
                <a href="quest5.html" class="quest-bubble q5">5. 배설</a>
                <a href="quest6.html" class="quest-bubble q6">6. 종합</a>
            </div>
        </div>
        </section>

        <!-- 보물 창고 영역: 태블릿에서 1칸, 데스크톱에서 1칸 차지 / min-h-0으로 개별 스크롤 생성 -->
        <aside class="card reward-card md:col-span-1 lg:col-span-1 min-h-0">
            <div class="reward-header">
                <h2 class="card-title">보물 창고</h2>
                <div class="ticket-badge">
                    쿠폰 <span id="reward-count" class="count-highlight">0</span>
                </div>
            </div>
            
            <button id="btn-claim-reward" class="btn-primary" disabled>보상 상자 열기 🎁</button>
            <div id="reward-area" class="reward-grid"></div>
        </aside>
    </main>

    <script src="js/main.js"></script>
    <script src="rewards/rewards.js"></script>
    <script>
        window.launchConfetti = function() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FF8FAB', '#82D1D9', '#FF9F1C'] });
        };

        // 데이터 동기화 초기화 로직
        document.getElementById('btn-reset').addEventListener('click', () => {
            if(confirm("모든 기록을 지우고 처음부터 다시 시작할까요?")) {
                if(window.UniversalReward) window.UniversalReward.reset();
                if(window.resetAllProgress) window.resetAllProgress();
                alert("기록이 완벽하게 백지화되었습니다.");
                location.reload(); 
            }
        });
    </script>
</body>
</html>
